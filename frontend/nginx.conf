server {
    listen 80;
    # 10 MB binary image uploads become ~13.3 MB once base64-encoded in JSON.
    # Keep some headroom so profile-picture updates pass through the proxy.
    client_max_body_size 20M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Resolve the backend service on each request so a recreated container
    # is picked up without reloading this nginx process.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api {
        set $backend_host backend;
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
    }
}
